<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="mathBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062038"/>
      <stop offset="60%" stop-color="#0b3154"/>
      <stop offset="100%" stop-color="#092540"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#mathBg)"/>
  <!-- Decorative Document Shapes -->
  <rect x="180" y="50" width="240" height="260" rx="12" fill="#0f2847" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <rect x="210" y="30" width="240" height="260" rx="12" fill="#13365e" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
  <!-- Header Bar -->
  <rect x="240" y="60" width="180" height="12" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="240" y="85" width="130" height="8" rx="4" fill="#94a3b8" opacity="0.5"/>
  <!-- Question Mock Rows -->
  <rect x="240" y="115" width="180" height="6" rx="3" fill="#64748b" opacity="0.4"/>
  <rect x="240" y="130" width="150" height="6" rx="3" fill="#64748b" opacity="0.4"/>
  <circle cx="250" cy="155" r="4" fill="#38bdf8"/>
  <rect x="265" y="152" width="80" height="6" rx="3" fill="#cbd5e1" opacity="0.7"/>
  <circle cx="250" cy="175" r="4" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="265" y="172" width="100" height="6" rx="3" fill="#64748b" opacity="0.5"/>
  <!-- Coordinate Axis on Right -->
  <g transform="translate(240, 200)">
    <line x1="0" y1="60" x2="160" y2="60" stroke="#64748b" stroke-width="1"/>
    <line x1="30" y1="80" x2="30" y2="0" stroke="#64748b" stroke-width="1"/>
    <!-- Parabola -->
    <path d="M 30,60 Q 80,0 130,60" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="80" cy="30" r="4" fill="#38bdf8"/>
  </g>
  <!-- Floating Badges -->
  <rect x="60" y="120" width="120" height="42" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
  <text x="120" y="146" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Grades 7–9</text>
  <rect x="420" y="220" width="130" height="42" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
  <text x="485" y="246" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle">Exam Bank</text>
</svg>
