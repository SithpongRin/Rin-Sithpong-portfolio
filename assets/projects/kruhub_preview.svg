  <!-- Main Content Dashboard -->
  <!-- Stats Row -->
  <rect x="174" y="86" width="112" height="48" rx="8" fill="#0e2a44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="186" y="102" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">Total Students</text>
  <text x="186" y="122" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#38bdf8">148</text>

  <rect x="296" y="86" width="112" height="48" rx="8" fill="#0e2a44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="308" y="102" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">Attendance Rate</text>
  <text x="308" y="122" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#10b981">96.4%</text>

  <rect x="418" y="86" width="130" height="48" rx="8" fill="#0e2a44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="430" y="102" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">Average Score</text>
  <text x="430" y="122" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#f59e0b">82.5 / 100</text>

  <!-- Classroom Table Mock -->
