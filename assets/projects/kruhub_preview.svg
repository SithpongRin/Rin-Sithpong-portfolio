  <text x="375" y="164" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#cbd5e1">Attendance</text>
  <text x="465" y="164" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#cbd5e1">Score / Status</text>

  <!-- Row 1 -->
  <line x1="174" y1="202" x2="548" y2="202" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="196" cy="188" r="8" fill="#0284c7"/>
  <text x="212" y="192" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">Chan Sovan</text>
  <text x="310" y="192" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Grade 8A</text>
  <rect x="375" y="182" width="46" height="16" rx="4" fill="rgba(16,185,129,0.2)"/>
  <text x="398" y="194" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#10b981" text-anchor="middle">Present</text>
  <text x="475" y="192" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">92 / 100</text>

  <!-- Row 2 -->
  <line x1="174" y1="238" x2="548" y2="238" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="196" cy="222" r="8" fill="#818cf8"/>
  <text x="212" y="226" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">Keo Pisey</text>
  <text x="310" y="226" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Grade 8A</text>
  <rect x="375" y="216" width="46" height="16" rx="4" fill="rgba(16,185,129,0.2)"/>
  <text x="398" y="228" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#10b981" text-anchor="middle">Present</text>
  <text x="475" y="226" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">88 / 100</text>

  <!-- Row 3 -->
  <line x1="174" y1="274" x2="548" y2="274" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="196" cy="256" r="8" fill="#f59e0b"/>
  <text x="212" y="260" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">Long Vicheka</text>
  <text x="310" y="260" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Grade 8B</text>
  <rect x="375" y="250" width="46" height="16" rx="4" fill="rgba(245,158,11,0.2)"/>
  <text x="398" y="262" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#f59e0b" text-anchor="middle">Late</text>
  <text x="475" y="260" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">79 / 100</text>

  <!-- Floating Firebase & Web App Badge -->
  <rect x="420" y="280" width="130" height="30" rx="6" fill="#ffca28" opacity="0.95"/>
  <text x="485" y="300" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#000000" text-anchor="middle">Firebase App</text>
</svg>
