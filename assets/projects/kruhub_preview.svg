      <stop offset="0%" stop-color="#062238"/>
      <stop offset="50%" stop-color="#08385c"/>
      <stop offset="100%" stop-color="#041a2e"/>
    </linearGradient>
    <linearGradient id="kruBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#kruBg)"/>

  <!-- Browser / App Window Mock -->
  <rect x="40" y="30" width="520" height="300" rx="14" fill="#0c1f33" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
  
  <!-- App Title Bar -->
  <rect x="40" y="30" width="520" height="42" rx="14" fill="#081726"/>
  <rect x="40" y="60" width="520" height="12" fill="#081726"/>
  <circle cx="64" cy="51" r="5" fill="#ef4444"/>
  <circle cx="80" cy="51" r="5" fill="#f59e0b"/>
  <circle cx="96" cy="51" r="5" fill="#10b981"/>
  
  <!-- URL Bar -->
  <rect x="130" y="40" width="280" height="22" rx="6" fill="#0f2b47" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="270" y="55" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#38bdf8" text-anchor="middle">kruhub-47766.firebaseapp.com</text>

  <!-- Left Sidebar Mock -->
  <rect x="52" y="82" width="110" height="236" rx="8" fill="#0a1a2b"/>
