  <text x="96" y="112" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">KruHub</text>

  <!-- Nav Items -->
  <rect x="64" y="136" width="86" height="18" rx="4" fill="rgba(2,132,199,0.25)"/>
