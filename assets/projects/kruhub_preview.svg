  <rect x="64" y="162" width="86" height="18" rx="4" fill="transparent"/>
  <text x="74" y="175" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">Students (បញ្ជីសិស្ស)</text>
  <rect x="64" y="188" width="86" height="18" rx="4" fill="transparent"/>
  <text x="74" y="201" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">Attendance (វត្តមាន)</text>
  <rect x="64" y="214" width="86" height="18" rx="4" fill="transparent"/>
  <text x="74" y="227" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">Scores (ពិន្ទុ)</text>
